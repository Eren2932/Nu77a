name: Server

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'server/**'
      - 'docker-compose.yml'
      - 'infra/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

env:
  GO_VERSION: '1.23'

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nuva
          POSTGRES_PASSWORD: nuva
          POSTGRES_DB: nuva_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nuva"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.mod

      # go.sum is generated here on the first run, so the repository never
      # carries a stale lock file that breaks the build.
      - name: Resolve dependencies
        working-directory: server
        run: |
          go mod tidy
          git diff --stat -- go.mod go.sum || true

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Test
        working-directory: server
        run: go test ./... -race -count=1

      - name: Build
        working-directory: server
        run: go build -o /tmp/nuva-server ./cmd/nuva-server

      - name: Smoke test the real binary against Postgres
        env:
          NUVA_ENV: development
          NUVA_PORT: 8080
          NUVA_DATABASE_URL: postgres://nuva:nuva@localhost:5432/nuva_test?sslmode=disable
          NUVA_JWT_SECRET: ci-secret-ci-secret-ci-secret-1234
          NUVA_MEDIA_DIR: /tmp/nuva-media
        run: |
          /tmp/nuva-server &
          SERVER_PID=$!
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/readyz >/dev/null 2>&1; then
              echo "server is ready"
              break
            fi
            sleep 1
          done
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh http://localhost:8080
          kill $SERVER_PID

  image:
    name: Publish container image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILT_AT=${{ github.event.repository.pushed_at }}

  deploy:
    name: Deploy to VPS
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Optional: add these three secrets when your VPS is ready. Until then the
    # job is skipped instead of failing the whole pipeline.
    steps:
      - name: Check deploy secrets
        id: check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "no DEPLOY_HOST secret set, skipping deploy"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'

      - name: Deploy over SSH
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/nuva
            git pull --ff-only
            docker compose pull server || true
            docker compose up -d --build server
            docker compose ps
            # Fail the deploy if the new container is not healthy.
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/readyz >/dev/null 2>&1; then
                echo "deploy healthy"; exit 0
              fi
              sleep 2
            done
            echo "new version did not become ready" >&2
            docker compose logs --tail=100 server
            exit 1
