# JVM settings for the Gradle daemon. 2g is enough for this module and fits
# inside a GitHub Actions runner without swapping.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is off on purpose: the release signing config reads
# environment variables, which the configuration cache cannot track.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official

# ---- Nuva build inputs -------------------------------------------------------
# Override from the command line or CI, e.g.
#   gradle :app:assembleRelease -PnuvaApiBaseUrl=https://api.nuva.club
nuvaVersionName=0.1.0
nuvaVersionCode=1
nuvaApiBaseUrl=https://api.nuva.club
nuvaApiBaseUrlDebug=http://10.0.2.2:8080
